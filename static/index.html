<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kb-qa 企业知识库问答</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f4f5f7; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1a56db; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 17px; font-weight: 500; }
  header span { font-size: 12px; opacity: .75; }
  #chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 78%; padding: 12px 16px; border-radius: 12px; line-height: 1.7; font-size: 14px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #1a56db; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #fff; color: #222; border: 1px solid #e3e5e8; border-bottom-left-radius: 4px; }
  .bot .src { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #d8dade; font-size: 12px; color: #6b7280; }
  .bot .src li { margin-left: 18px; margin-top: 4px; }
  .hint { align-self: center; color: #9ca3af; font-size: 12px; }
  footer { padding: 16px 24px; background: #fff; border-top: 1px solid #e3e5e8; display: flex; gap: 10px; }
  #q { flex: 1; padding: 11px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
  #q:focus { border-color: #1a56db; }
  button { padding: 11px 22px; background: #1a56db; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button:disabled { background: #9db8e8; cursor: wait; }
</style>
</head>
<body>
<header>
  <h1>kb-qa · 企业知识库问答</h1>
  <span>答案均来自知识库并标注引用 [n]</span>
</header>
<div id="chat">
  <div class="hint">已连接本地知识库。试试问："什么是RAG？"——问题知识库里没有时它会明确告诉你。</div>
</div>
<footer>
  <input id="q" placeholder="输入你的问题，回车发送…" autofocus>
  <button id="send">发送</button>
</footer>
<script>
const chat = document.getElementById('chat');
const q = document.getElementById('q');
const btn = document.getElementById('send');

function add(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function ask() {
  const text = q.value.trim();
  if (!text) return;
  add('user', text);
  q.value = '';
  btn.disabled = true;
  const bot = add('bot', '正在检索知识库…');
  try {
    const r = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    bot.textContent = data.answer;
    if (data.sources && data.sources.length) {
      const src = document.createElement('div');
      src.className = 'src';
      src.innerHTML = '引用来源：';
      const ul = document.createElement('ul');
      data.sources.forEach(s => {
        const li = document.createElement('li');
        li.textContent = `[${s.id}] ${s.source} —— ${s.excerpt}…`;
        ul.appendChild(li);
      });
      src.appendChild(ul);
      bot.appendChild(src);
    }
  } catch (e) {
    bot.textContent = '请求失败：' + e.message + '（服务没启动？索引建好了吗？）';
  }
  chat.scrollTop = chat.scrollHeight;
  btn.disabled = false;
  q.focus();
}

btn.onclick = ask;
q.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
